<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LocalGate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <span class="status-dot" data-state="connecting" id="status-dot"
            role="img" aria-label="Daemon status"></span>
          <span class="wordmark">LocalGate</span>
        </div>
        <div class="header-right">
          <button class="theme-toggle" id="theme-toggle" data-active="system"
            aria-label="Switch theme" title="Switch theme">
            <!-- system: monitor -->
            <svg class="ic-system" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="3" width="20" height="14" rx="2" />
              <path d="M8 21h8M12 17v4" />
            </svg>
            <!-- light: sun -->
            <svg class="ic-light" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <!-- dark: moon -->
            <svg class="ic-dark" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
          <span class="version" id="version">v0.1.0</span>
        </div>
      </header>

      <!-- Offline banner (revealed by JS when the daemon is unreachable) -->
      <div class="banner" id="banner" role="alert" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" />
          <path d="M12 9v4M12 17h.01" />
        </svg>
        <span id="banner-text">Daemon unreachable — routing defaults to cloud.</span>
      </div>

      <div class="divider"></div>

      <!-- Routing mode -->
      <section class="section">
        <span class="label">Routing mode</span>
        <div class="segment" id="segment" role="group" aria-label="Routing mode">
          <button class="segment__btn" data-mode="transparent" aria-pressed="false">
            Transparent
          </button>
          <button class="segment__btn" data-mode="hitl" aria-pressed="false">
            Review
          </button>
          <button class="segment__btn" data-mode="passthrough" aria-pressed="false">
            Bypass
          </button>
        </div>
        <p class="mode-desc" id="mode-desc"></p>
      </section>

      <div class="divider"></div>

      <!-- Live telemetry -->
      <section class="stats-grid">
        <div class="stat">
          <span class="stat__value is-placeholder" id="stat-local">—</span>
          <span class="stat__label">Local routes</span>
        </div>
        <div class="stat">
          <span class="stat__value is-placeholder" id="stat-latency">—</span>
          <span class="stat__label">Avg latency</span>
        </div>
      </section>

      <div class="divider"></div>

      <!-- Active model -->
      <section class="model-row">
        <span class="label">Model</span>
        <span class="model-value is-placeholder" id="model-name">—</span>
      </section>

      <div class="divider"></div>

      <!-- Local history lives in this profile until it is cleared here. A conversation
           answered only locally exists nowhere else: the provider never saw the prompt. -->
      <section class="model-row">
        <span class="label">Local history</span>
        <button type="button" class="link-button" id="clear-history">Clear</button>
      </section>

      <footer class="footer">
        <span class="footer-endpoint" id="endpoint">127.0.0.1:8400</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
